<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand service architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · com.eland.brand</p>
    <h1>From anonymous request to Postgres row</h1>

    <svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc">
      <title id="architecture-title">Brand service architecture</title>
      <desc id="architecture-desc">An anonymous HTTP request passes a permit-all Spring Security filter chain and an 8KB Jackson document cap, then flows through SampleController to SampleService, where validation and paging are decided, on to the MyBatis mapper and the Postgres sample table. Actuator and springdoc branch off the same open filter chain, and the health endpoint reaches the database directly.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ZONES (drawn first) ============ -->
      <rect x="216" y="168" width="248" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="268" y="172" width="144" height="12" rx="2" fill="#f5f5f5"/>
      <text x="340" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">HTTP EDGE</text>

      <rect x="520" y="168" width="264" height="384" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="568" y="172" width="168" height="12" rx="2" fill="#f5f5f5"/>
      <text x="652" y="181" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">SAMPLE PACKAGE</text>

      <!-- ============ ARROWS (before boxes) ============ -->

      <!-- A1  Client -> SecurityFilterChain -->
      <line x1="176" y1="260" x2="240" y2="260" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="192" y="240" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="249" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTP</text>

      <!-- A2  SecurityFilterChain -> Jackson -->
      <line x1="340" y1="304" x2="340" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="348" y="344" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="368" y="353" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BODY</text>

      <!-- A3  Jackson -> SampleController -->
      <path d="M 440,436 H 484 Q 492,436 492,428 V 244 Q 492,236 500,236 H 544" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="452" y="332" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="468" y="341" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BIND</text>

      <!-- A4  SampleController -> SampleService -->
      <line x1="652" y1="272" x2="652" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A5  SampleService -> SampleMapper -->
      <line x1="652" y1="392" x2="652" y2="440" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

      <!-- A6  SampleMapper -> PostgreSQL -->
      <path d="M 760,476 H 812 Q 820,476 820,468 V 372 Q 820,364 828,364 H 880" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="780" y="416" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="796" y="425" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SQL</text>

      <!-- A7  SecurityFilterChain -> Actuator / springdoc -->
      <path d="M 340,216 V 164 Q 340,156 348,156 H 972 Q 980,156 980,164 V 176" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="648" y="136" width="28" height="12" rx="2" fill="#f5f5f5"/>
      <text x="662" y="145" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPS</text>

      <!-- A8  Actuator -> PostgreSQL -->
      <line x1="980" y1="248" x2="980" y2="320" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="988" y="280" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="1016" y="289" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DB CHECK</text>

      <!-- ============ NODES ============ -->

      <!-- Client -->
      <rect x="40" y="216" width="136" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="216" width="136" height="88" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="224" width="32" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="64" y="232" fill="rgba(122,131,153,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">USER</text>
      <text x="108" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client</text>
      <text x="108" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">anonymous</text>

      <!-- SecurityFilterChain — accent 1 of 2 -->
      <rect x="240" y="216" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="216" width="200" height="88" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="248" y="224" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="262" y="232" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SEC</text>
      <text x="340" y="268" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SecurityFilterChain</text>
      <text x="340" y="288" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">permitAll · csrf off</text>

      <!-- Jackson -->
      <rect x="240" y="392" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="392" width="200" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="400" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="264" y="408" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JSON</text>
      <text x="340" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Jackson JsonMapper</text>
      <text x="340" y="464" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">maxDocumentLength 8KB</text>

      <!-- SampleController -->
      <rect x="544" y="200" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="200" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="552" y="208" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="566" y="216" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="652" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SampleController</text>
      <text x="652" y="260" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">routing only · /api/samples</text>

      <!-- SampleService — accent 2 of 2, focal -->
      <rect x="544" y="320" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="320" width="216" height="72" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="552" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.40)" stroke-width="0.8"/>
      <text x="566" y="336" fill="rgba(235,108,54,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SVC</text>
      <text x="652" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SampleService</text>
      <text x="652" y="380" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">validation · paging · tests</text>

      <!-- SampleMapper -->
      <rect x="544" y="440" width="216" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="544" y="440" width="216" height="72" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="552" y="448" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="566" y="456" fill="rgba(45,49,66,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DAO</text>
      <text x="652" y="484" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SampleMapper</text>
      <text x="652" y="500" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ SampleMapper.xml</text>

      <!-- Actuator / springdoc -->
      <rect x="880" y="176" width="200" height="72" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="176" width="200" height="72" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="888" y="184" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="902" y="192" fill="rgba(45,49,66,0.70)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">OPS</text>
      <text x="980" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Actuator · springdoc</text>
      <text x="980" y="236" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">/actuator/health</text>

      <!-- PostgreSQL -->
      <rect x="880" y="320" width="200" height="88" rx="6" fill="#f5f5f5"/>
      <rect x="880" y="320" width="200" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="888" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="902" y="336" fill="rgba(79,93,117,0.80)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="980" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="980" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sample · :5432</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="616" x2="1240" y2="616" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="652" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="136" y="644" width="12" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="156" y="652" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">FOCAL · SERVICE</text>

      <rect x="360" y="644" width="12" height="12" rx="2" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
      <text x="380" y="652" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">PERMIT-ALL EDGE</text>

      <rect x="584" y="644" width="12" height="12" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="604" y="652" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">DATASTORE</text>

      <rect x="784" y="644" width="12" height="12" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="804" y="652" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">OPS ENDPOINT</text>

      <line x1="1000" y1="650" x2="1012" y2="650" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="1020" y="652" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.08em">EXTERNAL HTTP</text>
    </svg>
  </div>
</body>
</html>
